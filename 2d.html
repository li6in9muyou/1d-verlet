<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全屏轻杆约束模拟</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        width: 100vw;
        position: relative;
      }

      #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .info {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(25, 35, 70, 0.7);
        padding: 15px;
        border-radius: 10px;
        color: white;
        font-size: 16px;
        max-width: 350px;
        z-index: 10;
      }

      .controls {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: flex;
        gap: 10px;
      }

      button {
        background: linear-gradient(to bottom, #4fc3f7, #0288d1);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      @media (max-width: 768px) {
        .info {
          font-size: 14px;
          padding: 10px;
          max-width: 300px;
        }

        button {
          padding: 8px 15px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="info">
      <h2>轻杆约束物理模拟</h2>
      <p>• 质点A(红色)和质点B(绿色)通过轻杆刚性连接</p>
      <p>• 初始状态：质点B以速度1.5向下移动</p>
      <p>• 模拟方法：Position-Based Dynamics(PBD)</p>
      <p>• 系统质心显示为黄色点</p>
    </div>

    <div class="controls">
      <button id="resetBtn">重置系统</button>
      <button id="pauseBtn">暂停/继续</button>
    </div>

    <div id="canvas-container"></div>

    <script>
      let particles = [];
      let constraints = [];
      let rodLength;
      let paused = false;
      let canvas;
      let centerX, centerY;
      let canvasWidth, canvasHeight;

      // 响应窗口大小变化
      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        canvasWidth = windowWidth;
        canvasHeight = windowHeight;
        centerX = canvasWidth / 2;
        centerY = canvasHeight / 2;
        rodLength = Math.min(canvasWidth, canvasHeight) * 0.3;
        resetSystem();
      }

      function setup() {
        // 创建全屏画布
        canvas = createCanvas(windowWidth, windowHeight);
        canvas.parent("canvas-container");

        canvasWidth = windowWidth;
        canvasHeight = windowHeight;
        centerX = canvasWidth / 2;
        centerY = canvasHeight / 2;
        rodLength = Math.min(canvasWidth, canvasHeight) * 0.3;

        resetSystem();

        // 设置按钮事件
        document
          .getElementById("resetBtn")
          .addEventListener("click", resetSystem);
        document.getElementById("pauseBtn").addEventListener("click", () => {
          paused = !paused;
        });

        // 响应窗口大小变化
        window.addEventListener("resize", windowResized);
      }

      // 质点类
      class Particle {
        constructor(x, y, mass, color) {
          this.position = createVector(x, y);
          this.previous = createVector(x, y);
          this.velocity = createVector(0, 0);
          this.acceleration = createVector(0, 0);
          this.mass = mass;
          this.invMass = 1.0 / mass;
          this.radius = 10; // 减小半径
          this.color = color;
          this.trail = [];
          this.maxTrail = 300;
        }

        update(dt) {
          // Verlet积分
          this.velocity = p5.Vector.sub(this.position, this.previous);
          this.previous = this.position.copy();

          // 应用加速度
          this.position.add(this.velocity);
          this.position.add(p5.Vector.mult(this.acceleration, dt * dt));

          // 重置加速度
          this.acceleration.mult(0);

          // 保存轨迹
          this.trail.push(this.position.copy());
          if (this.trail.length > this.maxTrail) {
            this.trail.shift();
          }

          // 边界约束 - 防止跑出屏幕
          if (this.position.x < this.radius) {
            this.position.x = this.radius;
          } else if (this.position.x > canvasWidth - this.radius) {
            this.position.x = canvasWidth - this.radius;
          }

          if (this.position.y < this.radius) {
            this.position.y = this.radius;
          } else if (this.position.y > canvasHeight - this.radius) {
            this.position.y = canvasHeight - this.radius;
          }
        }

        applyForce(force) {
          const f = p5.Vector.div(force, this.mass);
          this.acceleration.add(f);
        }

        display() {
          // 绘制轨迹
          noFill();
          stroke(255, 100);
          strokeWeight(1);
          beginShape();
          for (let i = 0; i < this.trail.length; i++) {
            vertex(this.trail[i].x, this.trail[i].y);
          }
          endShape();

          // 绘制质点
          fill(this.color);
          noStroke();
          ellipse(this.position.x, this.position.y, this.radius * 2);

          // 绘制速度向量
          if (this.velocity.mag() > 0.1) {
            stroke(255, 255, 0);
            strokeWeight(1.5);
            const vel = this.velocity.copy().mult(8);
            line(
              this.position.x,
              this.position.y,
              this.position.x + vel.x,
              this.position.y + vel.y,
            );
          }
        }
      }

      // 距离约束类
      class DistanceConstraint {
        constructor(p1, p2, distance) {
          this.p1 = p1;
          this.p2 = p2;
          this.distance = distance;
          this.stiffness = 1.0;
        }

        apply() {
          // 计算当前距离
          const delta = p5.Vector.sub(this.p2.position, this.p1.position);
          const currentDistance = delta.mag();

          // 计算修正向量
          const correction = delta.copy();
          correction.normalize();
          correction.mult((currentDistance - this.distance) * this.stiffness);

          // 根据质量分配修正量
          const totalMass = this.p1.mass + this.p2.mass;
          const ratio1 = this.p2.mass / totalMass;
          const ratio2 = this.p1.mass / totalMass;

          // 应用位置修正
          this.p1.position.add(p5.Vector.mult(correction, ratio1));
          this.p2.position.sub(p5.Vector.mult(correction, ratio2));
        }
      }

      function resetSystem() {
        particles = [];
        constraints = [];

        // 创建质点A和B
        particles.push(
          new Particle(centerX - rodLength / 2, 100, 30, color(255, 100, 100)),
        );
        particles.push(
          new Particle(centerX + rodLength / 2, 100, 10, color(100, 255, 100)),
        );

        // 给质点B初始向下速度（减小速度）
        particles[1].velocity.y = 3;
        particles[1].velocity.x = 1;
        particles[1].previous = createVector(
          particles[1].position.x - 1,
          particles[1].position.y - 3,
        );

        // 创建距离约束
        constraints.push(
          new DistanceConstraint(particles[0], particles[1], rodLength),
        );
      }

      function draw() {
        background(20, 30, 50, 200);

        // 绘制半透明网格
        drawGrid();

        // 更新物理
        if (!paused) {
          const dt = 1 / 60;

          // 更新质点位置
          for (let p of particles) {
            p.update(dt);
          }

          // 应用约束（多次迭代提高稳定性）
          for (let i = 0; i < 5; i++) {
            for (let c of constraints) {
              c.apply();
            }
          }
        }

        // 绘制轻杆
        stroke(180, 200, 255, 200);
        strokeWeight(3); // 减小杆宽
        line(
          particles[0].position.x,
          particles[0].position.y,
          particles[1].position.x,
          particles[1].position.y,
        );

        // 绘制质点
        for (let p of particles) {
          p.display();
        }

        // 绘制质心
        drawCenterOfMass();

        // 绘制状态信息
        drawStatus();
      }

      function drawGrid() {
        stroke(50, 50, 70, 60);
        strokeWeight(1);

        // 垂直线
        for (let x = 0; x <= canvasWidth; x += 50) {
          line(x, 0, x, canvasHeight);
        }

        // 水平线
        for (let y = 0; y <= canvasHeight; y += 50) {
          line(0, y, canvasWidth, y);
        }
      }

      function drawCenterOfMass() {
        // 计算质心位置
        let comX = 0;
        let comY = 0;
        let totalMass = 0;

        for (let p of particles) {
          comX += p.position.x * p.mass;
          comY += p.position.y * p.mass;
          totalMass += p.mass;
        }

        comX /= totalMass;
        comY /= totalMass;

        // 绘制质心
        fill(255, 255, 0, 200);
        noStroke();
        ellipse(comX, comY, 10, 10);

        // 绘制质心轨迹
        stroke(255, 255, 0, 100);
        strokeWeight(1.5);
        noFill();
        beginShape();
        for (let i = 0; i < particles[0].trail.length; i++) {
          const x =
            (particles[0].trail[i].x * particles[0].mass +
              particles[1].trail[i].x * particles[1].mass) /
            totalMass;
          const y =
            (particles[0].trail[i].y * particles[0].mass +
              particles[1].trail[i].y * particles[1].mass) /
            totalMass;
          vertex(x, y);
        }
        endShape();
      }

      function drawStatus() {
        fill(255);
        noStroke();
        textSize(16);
        textAlign(RIGHT, TOP);

        const vA = particles[0].velocity.mag().toFixed(2);
        const vB = particles[1].velocity.mag().toFixed(2);

        text(`质点A速度: ${vA}`, canvasWidth - 20, 20);
        text(`质点B速度: ${vB}`, canvasWidth - 20, 45);
        text(`系统状态: ${paused ? "已暂停" : "运行中"}`, canvasWidth - 20, 70);

        // 计算角速度
        const delta = p5.Vector.sub(
          particles[1].position,
          particles[0].position,
        );
        const center = p5.Vector.add(
          particles[0].position,
          p5.Vector.div(delta, 2),
        );
        const rA = p5.Vector.sub(particles[0].position, center);
        const rB = p5.Vector.sub(particles[1].position, center);

        // 计算角速度 (ω = (v × r) / |r|²)
        const vRelA = p5.Vector.sub(
          particles[0].velocity,
          particles[0].velocity,
        );
        const vRelB = p5.Vector.sub(
          particles[1].velocity,
          particles[0].velocity,
        );

        const crossA = rA.x * vRelA.y - rA.y * vRelA.x;
        const crossB = rB.x * vRelB.y - rB.y * vRelB.x;

        const omega = ((crossA + crossB) / (rA.magSq() + rB.magSq())).toFixed(
          2,
        );
        text(`角速度: ${omega} rad/frame`, canvasWidth - 20, 95);
      }
    </script>
  </body>
</html>
